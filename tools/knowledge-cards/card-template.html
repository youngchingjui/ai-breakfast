<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 360px;
    min-height: 450px;
    font-family: 'Inter', sans-serif;
    background: #FFFAF5;
    color: #292524;
    display: flex;
    flex-direction: column;
  }

  .card {
    width: 360px;
    min-height: 450px;
    padding: 40px 32px 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #FFFAF5;
  }

  .card-content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* Masthead — single line: brand · date */
  .masthead {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #C2410C;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .masthead-dot {
    width: 3px;
    height: 3px;
    background: #C2410C;
    border-radius: 50%;
    margin: 0 8px;
    flex-shrink: 0;
  }

  .masthead-date {
    color: #78716C;
    font-weight: 500;
  }

  /* Member highlight label — small uppercase above title */
  .member-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #EA580C;
    margin-bottom: 10px;
  }

  /* Title */
  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: 24px;
    line-height: 1.25;
    color: #292524;
    margin-bottom: 32px;
  }

  /* Divider */
  .divider {
    width: 40px;
    height: 3px;
    background: #C2410C;
    border-radius: 2px;
    margin-bottom: 28px;
  }

  /* Supporting points */
  .points {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .point {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .point-marker {
    width: 6px;
    height: 6px;
    min-width: 6px;
    background: #EA580C;
    border-radius: 50%;
    margin-top: 7px;
  }

  .point-text {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.6;
    color: #78716C;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    padding-top: 32px;
  }

  .footer-brand {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 13px;
    color: #292524;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="card-content">
    <div class="masthead">
      <span>AI Breakfast Shanghai</span>
      <span class="masthead-dot"></span>
      <span class="masthead-date" id="masthead-date">Apr 16, 2026</span>
    </div>

    <div class="member-label" id="member-label" style="display: none;"></div>

    <h1 class="title" id="title">TITLE</h1>

    <div class="divider"></div>

    <ul class="points" id="points">
      <li class="point">
        <div class="point-marker"></div>
        <p class="point-text">POINT 1</p>
      </li>
    </ul>
  </div>

  <div class="footer">
    <div class="footer-brand">AI Breakfast</div>
  </div>
</div>
</body>
</html>
