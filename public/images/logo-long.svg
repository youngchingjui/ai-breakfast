<svg xmlns="http://www.w3.org/2000/svg" width="600" height="160" viewBox="0 0 600 160">
  <!-- Long/horizontal logo: AI Breakfast on one line, Shanghai below -->
  <rect width="600" height="160" rx="12" fill="#FFFAF5"/>

  <!-- AI BREAKFAST -->
  <text x="300" y="82" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-weight="800" font-size="64" fill="#C2410C"
        letter-spacing="-0.01em">AI
    <tspan fill="#292524" font-weight="700"> Breakfast</tspan>
  </text>

  <!-- SHANGHAI -->
  <text x="300" y="118" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500" font-size="16" fill="#78716C"
        letter-spacing="0.25em">SHANGHAI</text>
</svg>
